# Upstream Schema Definition Sync Endpoints (AMQP Port)
# schema_definition_sync.upstream_endpoints.1.host = tanzu-rabbitmq-upstream
# schema_definition_sync.upstream_endpoints.1.port = 5672
# schema_definition_sync.username = schema-replicator
# schema_definition_sync.password = ReplPassword123

# Standby Message Replication Endpoints (Stream Port)
# standby_replication.upstream_endpoints.1.host = tanzu-rabbitmq-upstream
# standby_replication.upstream_endpoints.1.port = 5552
# standby_replication.username = schema-replicator
# standby_replication.password = ReplPassword123

schema_definition_sync.operating_mode = downstream

# this node will run as a downstream (passive) for
# warm standby queue and stream replication (WSR)
standby.replication.operating_mode = downstream

# total size message stream limit in bytes
# 5 GB - adjust if needed
standby.replication.retention.size_limit.messages = 5000000000

# this is IMPORTANT, otherwise schema sync plug-in
# can interfere with the local state of the warm standby replication
schema_definition_sync.downstream.locals.global_parameters = ^standby

schema_definition_sync.connection.endpoints.one = tanzu-rabbitmq-upstream:5672
schema_definition_sync.connection.username = schema-replicator
schema_definition_sync.connection.password = ReplPassword123

standby.replication.connection.endpoints.one = tanzu-rabbitmq-upstream:5552
standby.replication.connection.username = offsite-replicator
standby.replication.connection.password = ReplPassword123