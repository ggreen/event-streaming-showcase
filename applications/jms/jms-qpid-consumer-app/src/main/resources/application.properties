spring.application.name=rabbitmq.jms.showcase
spring.rabbitmq.addresses=amqp://localhost:5672
spring.rabbitmq.username=${TANZU_RABBITMQ_USER}
spring.rabbitmq.password=${TANZU_RABBITMQ_PASSWORD}
server.port=8855


app.queue.selector-fields=name,status,city,state,zip

app.queue.name=accounts
app.message.selector=status = 'ACTIVE' AND (state = 'NY' OR state = 'CA') AND city IN ('NY', 'LA', 'IM','ANI') AND zip LIKE '90%'